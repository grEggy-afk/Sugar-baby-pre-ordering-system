<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sugar Baby Shop | Milk Tea & Coffee</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="menu.css">
   <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside id="sidebar">
    <div class="brand-section">
      <div class="logo-circle"><i class="fa-solid fa-mug-hot"></i></div>
      <h1 class="brand-title">SUGAR<br>BABY</h1>
      <span class="brand-subtitle">MILK TEA & COFFEE</span>
    </div>

    <div class="nav-section">
      <div class="nav-title">MENU</div>
      <ul class="nav-list">
        <li class="nav-item">
          <a class="nav-link" data-target="dashboardView">
            <i class="fa-solid fa-chart-pie"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" data-target="menuView">
            <i class="fa-solid fa-glass-water"></i> Menu
          </a>
        </li>
        <li class="nav-item"><a class="nav-link"><i class="fa-solid fa-cart-shopping"></i> Orders</a></li>
        <li class="nav-item"><a class="nav-link"><i class="fa-solid fa-rotate-left"></i> History</a></li>
      </ul>
    </div>

    <div class="nav-section">
      <div class="nav-title">SYSTEM</div>
      <ul class="nav-list">
        <li class="nav-item"><a class="nav-link"><i class="fa-solid fa-gear"></i> Settings</a></li>
        <li class="nav-item"><a class="nav-link"><i class="fa-solid fa-circle-info"></i> About Us</a></li>
      </ul>
    </div>

    <button class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
  </aside>

  <main>
    <header>
      <button class="menu-toggle" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search milk tea & coffee...">
      </div>
      <div class="user-profile">
        <div class="notification-btn"><i class="fa-regular fa-bell"></i></div>
        <div class="user-info">
          <div style="font-weight:700; font-size:13px;">John Laurenz Sunga</div>
          <div style="font-size:11px; color:#78909C;">Store Manager</div>
        </div>
        <div class="avatar-circle">SB</div>
      </div>
    </header>

    <div class="dashboard-container">

      <!-- VIEW 1: DASHBOARD -->
      <section id="dashboardView" class="view-section">
        <h2 class="page-title">Sugar Baby Dashboard</h2>
        <div class="cards">
          <div class="card">
            <div>
              <div class="card-label">Daily Sales</div>
              <div class="card-value">₱18,450</div>
            </div>
            <div class="card-icon"><i class="fa-solid fa-peso-sign"></i></div>
          </div>
          <div class="card">
            <div>
              <div class="card-label">Cups Sold</div>
              <div class="card-value">342</div>
            </div>
            <div class="card-icon"><i class="fa-solid fa-glass-water"></i></div>
          </div>
          <div class="card">
            <div>
              <div class="card-label">Pending Orders</div>
              <div class="card-value">12</div>
            </div>
            <div class="card-icon"><i class="fa-solid fa-receipt"></i></div>
          </div>
          <div class="card">
            <div>
              <div class="card-label">Active Flavors</div>
              <div class="card-value" id="totalFlavorsCount">0</div>
            </div>
            <div class="card-icon"><i class="fa-solid fa-mug-hot"></i></div>
          </div>
        </div>
      </section>

      <!-- VIEW 2: MENU -->
      <section id="menuView" class="view-section active">
        <div class="header-action-row">
          <h2 class="page-title" style="margin-bottom:0;">Flavors Menu</h2>
          <button class="btn-primary" id="addNewItemBtn"><i class="fa-solid fa-plus"></i> Add New Item</button>
        </div>
        
        <div class="category-tabs" id="categoryTabs"></div>
        <div class="products-grid" id="productsGrid"></div>
      </section>

    </div>
  </main>

  <!-- MODAL FOR ADD/EDIT -->
  <div class="modal-overlay" id="editModalOverlay">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-bottom:16px; font-size:16px;">Product Settings</h3>
      <form id="editForm">
        <input type="hidden" id="editItemIndex">
        <div class="form-group">
          <label>Item Name</label>
          <input type="text" id="editItemName" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="editItemCategory" required>
        </div>
        <div class="form-group">
          <label>Add-ons Info</label>
          <input type="text" id="editItemAddons" placeholder="e.g. Add-ons • ₱10">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="editItemAvailability">
            <option value="true">Available</option>
            <option value="false">Unavailable</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="closeModalBtn">Cancel</button>
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
